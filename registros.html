  <style>
  .nx-menu,
.nx-menu * { box-sizing: border-box; }

/* Panel escondido a la izquierda; solo asoma una pestañita */
.nx-menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 250px;
  height: 103vh;
  padding: 18px 38px 20px 12px;
  overflow-y: auto;
  scrollbar-width: thin;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 14px;
  color: #fff;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, rgba(42, 32, 96, 0.97), rgba(19, 15, 31, 0.97));
  border-right: 2px solid rgba(167, 139, 250, 0.5);
  border-radius: 0 18px 18px 0;
  transform: translateX(calc(-100% + 26px));
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

/* Icono de la pestañita */
.nx-menu::after {
  content: "☰";
  position: absolute;
  top: 24px;
  right: 0;
  width: 26px;
  text-align: center;
  font-size: 1.2rem;
  transition: opacity 0.2s;
}

/* Al pasar el mouse, el menú sale */
.nx-menu:hover,
.nx-menu:focus-within {
  transform: translateX(0);
  box-shadow: 8px 0 30px rgba(0, 0, 0, 0.55);
}

.nx-menu:hover::after,
.nx-menu:focus-within::after { opacity: 0; }

.nx-titulo-menu {
  margin: 0;
  padding: 0 4px;
  font-size: 1.15rem;
  line-height: 1.2;
}

.nx-genero {
  margin: 0;
  background: rgba(19, 15, 31, 0.75);
  border: 1px solid rgba(167, 139, 250, 0.35);
  border-radius: 14px;
  overflow: hidden;
}

.nx-boton {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 46px;
  margin: 0;
  padding: 0 14px;
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, #5b46b8, #8a3a63);
  cursor: pointer;
  list-style: none;
}

.nx-boton::-webkit-details-marker { display: none; }
.nx-boton::marker { content: ""; }
.nx-boton::after { content: "–"; }
.nx-genero:not([open]) .nx-boton::after { content: "+"; }
.nx-boton:hover { filter: brightness(1.15); }

.nx-lista { margin: 0; padding: 6px 0; list-style: none; }
.nx-lista li { margin: 0; padding: 0; }

.nx-lista a {
  display: block;
  height: 38px;
  line-height: 38px;
  padding: 0 14px 0 20px;
  font-size: 0.92rem;
  color: #fff;
  text-decoration: none;
}

.nx-lista a:hover { background: rgba(255, 255, 255, 0.1); }
@media(max-width: 600px){
  .contenedor {padding-left: 56;}
}
</style>
</head>

    <!-- Zona principal: aquí estaba la imagen, ahora va el formulario -->
    <main class="principal" id="registro">
      <div class="tarjeta">
        <h1>Crea tu Cuenta</h1>

        <form id="formulario" novalidate autocomplete="off">

          <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Nombre" maxlength="100">
            <small class="error" id="error-nombre" aria-live="polite"></small>
          </div>

          <div class="campo">
            <label for="paterno">Apellido paterno:</label>
            <input type="text" id="paterno" placeholder="Apellido paterno" maxlength="100">
            <small class="error" id="error-paterno" aria-live="polite"></small>
          </div>

          <div class="campo">
            <label for="materno">Apellido materno:</label>
            <input type="text" id="materno" placeholder="Apellido materno" maxlength="100">
            <small class="error" id="error-materno" aria-live="polite"></small>
          </div>

          <div class="campo">
            <label for="edad">Edad:</label>
            <input type="text" id="edad" placeholder="Edad" maxlength="3" inputmode="numeric">
            <small class="error" id="error-edad" aria-live="polite"></small>
          </div>

          <div class="campo">
            <label for="dia">Fecha de nacimiento:</label>
            <div class="fecha">
              <select id="dia" aria-label="Día"><option value="">Día</option></select>
              <select id="mes" aria-label="Mes"><option value="">Mes</option></select>
              <select id="anio" aria-label="Año"><option value="">Año</option></select>
            </div>
            <small class="error" id="error-fecha" aria-live="polite"></small>
          </div>

          <div class="campo">
            <label for="tarjeta">Número de tarjeta:</label>
            <input type="text" id="tarjeta" placeholder="16 dígitos" maxlength="16" inputmode="numeric">
            <small class="error" id="error-tarjeta" aria-live="polite"></small>
          </div>

          <div class="campo">
            <label for="email">Correo electrónico:</label>
            <input type="text" id="email" placeholder="usuario@gmail.com" maxlength="200" inputmode="email" autocapitalize="off">
            <small class="error" id="error-email" aria-live="polite"></small>
          </div>

          <button type="submit" id="validar" disabled>Validar</button>
          <p class="ayuda" id="ayuda">Completa todos los campos para poder validar.</p>
        </form>
      </div>
    </main>
  </div>

  <!-- Cuadro de notificación -->

      <p id="modal-texto"></p>
      <button type="button" id="modal-cerrar">Aceptar</button>
